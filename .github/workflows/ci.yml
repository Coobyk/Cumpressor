name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.artifact }}
    strategy:
      # One platform failing must not cancel the others.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: cumpressor-linux-x64
            binary: cumpressor
          - os: macos-latest # Apple Silicon (arm64) runners
            target: aarch64-apple-darwin
            artifact: cumpressor-macos-arm64
            binary: cumpressor
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: cumpressor-windows-x64
            binary: cumpressor.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies (GPUI + ffmpeg for the encode tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev \
            libfontconfig1-dev libfreetype-dev libvulkan1 \
            ffmpeg

      - name: Build (release)
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Test
        run: cargo test --workspace --locked --target ${{ matrix.target }}
        # Tests that need a real ffmpeg binary skip themselves when it is
        # absent (macOS and Windows runners don't ship one; Linux does).

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Release
    # main pushes replace the rolling "latest" prerelease; v* tags create
    # stable versioned releases (which the AUR packages pin).
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package per-platform archives
        run: |
          cd artifacts
          chmod +x cumpressor-linux-x64/cumpressor cumpressor-macos-arm64/cumpressor
          tar czf cumpressor-linux-x64.tar.gz -C cumpressor-linux-x64 cumpressor
          tar czf cumpressor-macos-arm64.tar.gz -C cumpressor-macos-arm64 cumpressor
          (cd cumpressor-windows-x64 && zip ../cumpressor-windows-x64.zip cumpressor.exe)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          if [[ "$GITHUB_REF_NAME" == latest || "$GITHUB_REF_TYPE" == branch ]]; then
            tag=latest
            flags=(--prerelease)
            title="Cumpressor latest (main @ ${GITHUB_SHA::7})"
            notes="Automated build of \`main\` @ ${{ github.sha }}."
          else
            tag="$GITHUB_REF_NAME"
            flags=()
            title="Cumpressor $tag"
            notes="Stable release of \`$tag\`."
          fi
          if [[ "$tag" == latest ]]; then
            gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            "${flags[@]}" \
            --title "$title" \
            --notes "$notes" \
            cumpressor-*.tar.gz cumpressor-*.zip
